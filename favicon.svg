<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="axonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#59d499" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#02110c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Neo-Brutalist Circular Frame -->
  <circle cx="128" cy="128" r="120" fill="#02110c" stroke="#000000" stroke-width="8"/>
  <circle cx="128" cy="128" r="114" fill="url(#axonGlow)"/>

  <!-- Decentralized Cryptographic Hexagon Shield -->
  <polygon points="128,38 206,83 206,173 128,218 50,173 50,83" 
           fill="none" stroke="#59d499" stroke-width="4" stroke-dasharray="6,4" opacity="0.85"/>
  
  <!-- Cryptographic Vertex Nodes -->
  <circle cx="128" cy="38" r="6" fill="#59d499" stroke="#000000" stroke-width="2.5"/>
  <circle cx="206" cy="83" r="6" fill="#59d499" stroke="#000000" stroke-width="2.5"/>
  <circle cx="206" cy="173" r="6" fill="#59d499" stroke="#000000" stroke-width="2.5"/>
  <circle cx="128" cy="218" r="6" fill="#59d499" stroke="#000000" stroke-width="2.5"/>
  <circle cx="50" cy="173" r="6" fill="#59d499" stroke="#000000" stroke-width="2.5"/>
  <circle cx="50" cy="83" r="6" fill="#59d499" stroke="#000000" stroke-width="2.5"/>

  <!-- Central AXON Geometric Monogram "A" -->
  <!-- Legs of A -->
  <line x1="128" y1="78" x2="83" y2="178" stroke="#f3ebd6" stroke-width="14" stroke-linecap="round"/>
  <line x1="128" y1="78" x2="173" y2="178" stroke="#f3ebd6" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Horizontal Emerald Cryptographic Crossbar -->
  <line x1="102" y1="140" x2="154" y2="140" stroke="#59d499" stroke-width="12" stroke-linecap="round"/>

  <!-- Apex Neural Node -->
  <circle cx="128" cy="78" r="10" fill="#59d499" stroke="#000000" stroke-width="3"/>
  <circle cx="128" cy="78" r="4" fill="#ffffff"/>
</svg>
